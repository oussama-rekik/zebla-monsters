name: Construire l'APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Installer les dépendances
        run: npm install

      - name: Copier le jeu dans le projet Android
        run: npx cap sync android

      - name: Compiler l'APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk zebla-monsters.apk

      - name: Garder l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: zebla-monsters-apk
          path: zebla-monsters.apk

      - name: Publier l'APK (téléchargeable depuis le téléphone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Zebla Monsters — APK n°${{ github.run_number }}
          body: "Télécharge **zebla-monsters.apk** depuis ton téléphone Android, puis ouvre-le pour l'installer."
          files: zebla-monsters.apk
